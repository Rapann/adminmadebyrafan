<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Portofolio Rafan</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-user-shield"></i>
                <h2>Admin Access</h2>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="Username" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                </div>
                <button type="submit" class="btn-save">Masuk Sekarang</button>
            </form>
            <p class="login-footer">Silakan masukkan kredensial admin Anda.</p>
        </div>
    </div>

    <div class="admin-container" style="display:none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-code"></i>
                <h1>Admin Panel</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="#profile" class="active"><i class="fas fa-user"></i> Profil</a></li>
                    <li><a href="#projects"><i class="fas fa-tasks"></i> Proyek</a></li>
                    <li><a href="#achievements"><i class="fas fa-trophy"></i> Pencapaian</a></li>
                    <li><a href="#education"><i class="fas fa-graduation-cap"></i> Pendidikan</a></li>
                    <li><a href="#skills"><i class="fas fa-tools"></i> Keterampilan</a></li>
                    <li><a href="#documentation"><i class="fas fa-images"></i> Dokumentasi</a></li>
                    <li><a href="#comments"><i class="fas fa-comments"></i> Komentar</a></li>
                </ul>
            </nav>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </aside>

        <main class="content">
            <header>
                <h2 id="section-title">Edit Profil</h2>
                <div class="api-config">
                    <i class="fas fa-link"></i>
                    <input type="text" id="api-url" placeholder="API URL">
                </div>
            </header>


            <!-- Profile Section -->
            <section id="profile-section" class="admin-section">
                <form id="profile-form">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Subtitle</label>
                        <input type="text" name="subtitle" required>
                    </div>
                    <div class="form-group">
                        <label>Deskripsi</label>
                        <textarea name="description" rows="5" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Quote</label>
                        <input type="text" name="quote" required>
                    </div>
                    <div class="form-group">
                        <label>Path Foto Profil</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" name="profileImg" placeholder="assets/Foto Profil.png" style="flex:1;">
                            <input type="file" accept="image/*" onchange="handleImageUpload(this, 'profileImg', 'profile-form')" style="display:none;" id="file-upload-profile">
                            <button type="button" onclick="document.getElementById('file-upload-profile').click()" class="btn-edit" style="padding:0 15px;">Upload</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-save">Simpan Perubahan</button>
                </form>
            </section>

            <!-- Projects Section -->
            <section id="projects-section" class="admin-section" style="display:none;">
                <button class="btn-add" onclick="showModal('project')">Tambah Proyek Baru</button>
                <div id="projects-list" class="data-list">
                    <!-- Projects will be loaded here -->
                </div>
            </section>

            <!-- Achievements Section -->
            <section id="achievements-section" class="admin-section" style="display:none;">
                <button class="btn-add" onclick="showModal('achievement')">Tambah Pencapaian Baru</button>
                <div id="achievements-list" class="data-list">
                    <!-- Achievements will be loaded here -->
                </div>
            </section>

            <!-- Education Section -->
            <section id="education-section" class="admin-section" style="display:none;">
                <button class="btn-add" onclick="showModal('education')">Tambah Pendidikan Baru</button>
                <div id="education-list" class="data-list">
                    <!-- Education will be loaded here -->
                </div>
            </section>

            <!-- Skills Section -->
            <section id="skills-section" class="admin-section" style="display:none;">
                <button class="btn-add" onclick="showModal('skill')">Tambah Keterampilan Baru</button>
                <div id="skills-list" class="data-list">
                    <!-- Skills will be loaded here -->
                </div>
            </section>

            <!-- Documentation Section -->
            <section id="documentation-section" class="admin-section" style="display:none;">
                <button class="btn-add" onclick="showModal('documentation')">Tambah Dokumentasi Baru</button>
                <div id="documentation-list" class="data-list">
                    <!-- Documentation will be loaded here -->
                </div>
            </section>

             <!-- Comments Section -->
             <section id="comments-section" class="admin-section" style="display:none;">
                <div id="comments-list" class="data-list">
                    <!-- Comments will be loaded here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for adding/editing items -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Tambah Item</h2>
            <form id="modal-form">
                <!-- Form fields will be injected here -->
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
